name: Deploy playground to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "playground/**"
      - ".github/workflows/deploy-playground.yml"
  workflow_dispatch:

# Pages serves the uploaded artifact directly — there is no publishing SOURCE
# BRANCH any more. Deleting gh-pages is what unpublished the site on 2026-07-28
# (GitHub disables a Pages site when its source branch goes away, and pushing
# the branch back does not re-enable it), and a branch nothing reads cannot do
# that again.
#
# Permissions are per JOB, not workflow-wide, so the job that runs `npm ci` (i.e.
# third-party install scripts) never holds a token that can publish: build gets
# contents:read, and only deploy gets pages:write to publish plus id-token:write
# to mint the OIDC token the Pages API decodes to verify which repo, ref and
# workflow the deployment came from.

# One deployment at a time, and never cancel one in flight: deploy-pages traps
# SIGTERM and cancels the LIVE Pages deployment, so cancel-in-progress: true
# aborts a production publish rather than merely abandoning a runner.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: playground/package-lock.json
      - run: npm ci
        working-directory: playground
      # serve under https://<owner>.github.io/<repo>/
      - run: npm run build -- --base="/${{ github.event.repository.name }}/"
        working-directory: playground
      # path is workspace-relative on purpose: upload-pages-artifact is a
      # composite action, and neither a job-level working-directory nor
      # defaults.run reaches the tar step inside it.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: playground/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
